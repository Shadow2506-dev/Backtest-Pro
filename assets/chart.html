<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Backtest Pro - Chart Engine</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #090b0f; --panel: #0d1117; --panel2: #111822; --border: #1a2233;
      --accent: #00e5ff; --green: #00e676; --red: #ff1744; --amber: #ffab00;
      --purple: #bb86fc; --text: #c9d1d9; --muted: #4a5568;
      --font-mono: 'Courier New', monospace;
      --chart-bg: #090b0f; --chart-grid: #0d1117; --chart-text: #6b7a99;
    }
    [data-theme="light"] {
      --bg: #f0f2f5; --panel: #ffffff; --panel2: #f8f9fa; --border: #dde1e7;
      --accent: #0077cc; --green: #00873d; --red: #cc0022; --amber: #b87800;
      --purple: #7c3aed; --text: #1a1d23; --muted: #8892a0;
      --chart-bg: #ffffff; --chart-grid: #f0f2f5; --chart-text: #8892a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 12px; overflow: hidden; }
    #chart-wrap { position: relative; width: 100vw; height: 100vh; background: var(--chart-bg); }
    #chart { width: 100%; height: 100%; }
    #draw-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #fib-legend { position: absolute; top: 6px; right: 6px; background: rgba(9,11,15,.9); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; font-size: 10px; z-index: 20; display: none; }
    .fib-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .fib-swatch { width: 18px; height: 2px; }
    #goto-btn { position: absolute; bottom: 12px; right: 12px; display: none; background: var(--panel); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 4px; cursor: pointer; z-index: 50; }
    #goto-btn.visible { display: block; }
  </style>
</head>
<body>
<div id="chart-wrap">
  <div id="chart"></div>
  <canvas id="draw-canvas"></canvas>
  <div id="fib-legend"></div>
  <button id="goto-btn" onclick="gotoLatest()">Latest</button>
</div>

<script>
// REACT NATIVE BRIDGE
function sendToRN(action, payload) {
  if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    window.ReactNativeWebView.postMessage(JSON.stringify({ action, payload }));
  }
}

window.onMessageFromRN = function(rawMessage) {
  try {
    const message = JSON.parse(rawMessage);
    const { action, payload } = message;
    switch (action) {
      case 'LOAD_CSV':
        if (payload && payload.csvText) handleLoadedCSV(payload.csvText, payload.filename);
        break;
      case 'SET_TOOL':
        if (payload && payload.tool) setTool(payload.tool);
        break;
      case 'SET_THEME':
        if (payload && payload.theme) {
          document.documentElement.setAttribute('data-theme', payload.theme);
          applyChartTheme(payload.theme === 'light');
          try { localStorage.setItem('bp_theme', payload.theme); } catch(e) {}
        }
        break;
      case 'NEXT_BAR': nextBar(); break;
      case 'PREV_BAR': prevBar(); break;
      case 'GOTO_LATEST': gotoLatest(); break;
      case 'OPEN_TRADE':
        if (payload) openTrade(payload.type);
        break;
      case 'CLOSE_TRADE': closeTrade(); break;
      case 'SET_PIP_SIZE':
        if (payload && payload.pipSize) { PIP_SIZE = payload.pipSize; saveSettings(); }
        break;
      case 'SET_PIP_VALUE':
        if (payload && payload.pipValue) { PIP_VALUE_PER_LOT = payload.pipValue; saveSettings(); }
        break;
      case 'CLEAR_DRAWINGS': clearDrawings(); break;
      case 'CLEAR_TRADES': clearTrades(); break;
      case 'LOAD_DATASET':
        if (payload) loadDatasetById(payload.id, payload.assetName);
        break;
      case 'DELETE_DATASET':
        if (payload) deleteDataset(payload.cat, payload.pair, payload.id);
        break;
      case 'UPDATE_TOOL_SETTINGS':
        if (payload) updateToolSettingsFromRN(payload);
        break;
      default: console.log('Unknown RN action:', action);
    }
  } catch (e) { console.error('Bridge error:', e); }
};

function updateToolSettingsFromRN(payload) {
  if (activeTool !== 'cursor' && TS[activeTool]) {
    if (payload.color) TS[activeTool].color = payload.color;
    if (payload.width) TS[activeTool].width = payload.width;
    if (payload.style) TS[activeTool].style = payload.style;
    if (selIdx >= 0 && drawings[selIdx] && drawings[selIdx].type === activeTool) {
      const d = drawings[selIdx];
      if (d.series) {
        d.series.forEach(s => {
          try { s.applyOptions({ color: TS[activeTool].color, lineWidth: TS[activeTool].width, lineStyle: lwcLS(TS[activeTool].style) }); }
          catch(e) {}
        });
      }
    }
    scheduleRender();
  }
}

// CORE STATE
let rawBars = [], bars = [], currentIndex = 1, currentTf = 1;
let currentPosition = null, trades = [];
let PIP_SIZE = 0.0001, PIP_VALUE_PER_LOT = 10;
let activeTool = 'cursor';
let currentAssetName = 'MOCK';

const CATEGORIES = ['FOREX','CRYPTO','FUTURES','COMMODITIES'];
const DEFAULT_PAIRS = {
  FOREX: ['EURUSD','GBPUSD','USDJPY','GBPJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURGBP','EURJPY'],
  CRYPTO: ['BTC/USD','ETH/USD','BNB/USD','SOL/USD','XRP/USD'],
  FUTURES: ['ES (S&P500)','NQ (Nasdaq)','CL (Crude Oil)','GC (Gold)','ZB (T-Bond)'],
  COMMODITIES: ['XAUUSD (Gold)','XAGUSD (Silver)','USOIL','UKOIL','NATGAS']
};
let assetDB = {};
CATEGORIES.forEach(cat => { assetDB[cat] = {}; DEFAULT_PAIRS[cat].forEach(pair => { assetDB[cat][pair] = []; }); });

function saveAssets() { try { localStorage.setItem('bp_assets', JSON.stringify(assetDB)); sendToRN('ASSET_DB_UPDATE', { assetDB }); } catch(e){} }
function saveTrades() { try { localStorage.setItem('bp_trades', JSON.stringify(trades)); } catch(e){} }
function saveSettings() { try { localStorage.setItem('bp_settings', JSON.stringify({ pipSize: PIP_SIZE, pipVal: PIP_VALUE_PER_LOT })); } catch(e){} }

function loadStorage() {
  try {
    const a = localStorage.getItem('bp_assets');
    if (a) {
      const saved = JSON.parse(a);
      CATEGORIES.forEach(cat => {
        if (saved[cat]) Object.entries(saved[cat]).forEach(([pair,ds]) => {
          if (!assetDB[cat][pair]) assetDB[cat][pair] = [];
          if (Array.isArray(ds) && ds.length) assetDB[cat][pair] = ds;
        });
      });
    }
    const t = localStorage.getItem('bp_trades');
    if (t) trades = JSON.parse(t);
    const s = localStorage.getItem('bp_settings');
    if (s) { const p = JSON.parse(s); PIP_SIZE = p.pipSize || 0.0001; PIP_VALUE_PER_LOT = p.pipVal || 10; }
    const theme = localStorage.getItem('bp_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e) { console.warn('loadStorage:', e); }
}

// CHART INIT
const chartEl = document.getElementById('chart');
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const r = chartEl.getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
}

const chart = LightweightCharts.createChart(chartEl, {
  width: window.innerWidth, height: window.innerHeight,
  layout: { background: { color: '#090b0f' }, textColor: '#6b7a99' },
  grid: { vertLines: { color: '#0d1117' }, horzLines: { color: '#0d1117' } },
  timeScale: {
    timeVisible: true, secondsVisible: true, borderColor: '#1a2233',
    tickMarkFormatter: t => {
      const d = new Date(t * 1000), p = n => String(n).padStart(2, '0');
      if (currentTf >= 43200) return d.getUTCFullYear() + '/' + p(d.getUTCMonth() + 1);
      if (currentTf >= 1440) return p(d.getUTCMonth() + 1) + '/' + p(d.getUTCDate());
      return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
    }
  },
  rightPriceScale: { borderColor: '#1a2233' },
  crosshair: { vertLine: { color: '#00e5ff33', labelBackgroundColor: '#0d1117' }, horzLine: { color: '#00e5ff33', labelBackgroundColor: '#0d1117' } }
});

const candleSeries = chart.addCandlestickSeries({
  upColor: '#00e676', downColor: '#ff1744', borderVisible: false,
  wickUpColor: '#00e676', wickDownColor: '#ff1744'
});

window.addEventListener('resize', () => { chart.resize(window.innerWidth, window.innerHeight); resizeCanvas(); scheduleRender(); });

function applyChartTheme(light) {
  chart.applyOptions({
    layout: { background: { color: light ? '#ffffff' : '#090b0f' }, textColor: light ? '#333' : '#6b7a99' },
    grid: { vertLines: { color: light ? '#f0f2f5' : '#0d1117' }, horzLines: { color: light ? '#f0f2f5' : '#0d1117' } }
  });
}

// DRAWING ENGINE
canvas.style.pointerEvents = 'none';

function enableCanvasDrag() { canvas.style.pointerEvents = 'all'; canvas.style.cursor = 'grab'; }
function disableCanvasDrag() { canvas.style.pointerEvents = 'none'; canvas.style.cursor = 'default'; }

function pxToPrice(y) { return candleSeries.coordinateToPrice(y); }
function pxToTime(x) { return chart.timeScale().coordinateToTime(x); }

const HANDLE_RADIUS = 14;

function hitHandle(d, mx, my) {
  if (!d) return null;
  const hit = (hx, hy) => hx != null && hy != null && Math.hypot(mx - hx, my - hy) <= HANDLE_RADIUS;
  if (d.type === 'hline') {
    const y = p2y(d.meta.price);
    if (hit(canvas.width * 0.25, y) || hit(canvas.width * 0.5, y) || hit(canvas.width * 0.75, y)) return 'body';
  }
  if (d.type === 'vline') {
    const x = t2x(d.meta.time);
    if (hit(x, canvas.height * 0.25) || hit(x, canvas.height * 0.5) || hit(x, canvas.height * 0.75)) return 'body';
  }
  if (d.type === 'trendline') {
    const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price);
    const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price);
    if (hit(x1, y1)) return 'p1';
    if (hit(x2, y2)) return 'p2';
    if (x1 != null && y1 != null && x2 != null && y2 != null) {
      if (segDist(mx, my, x1, y1, x2, y2) < HANDLE_RADIUS * 1.5) return 'body';
    }
  }
  if (d.type === 'box') {
    const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price);
    const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price);
    if (x1 == null || x2 == null || y1 == null || y2 == null) return null;
    const lx = Math.min(x1, x2), rx = Math.max(x1, x2), ty = Math.min(y1, y2), by = Math.max(y1, y2);
    if (hit(lx, ty)) return 'tl'; if (hit(rx, ty)) return 'tr';
    if (hit(lx, by)) return 'bl'; if (hit(rx, by)) return 'br';
    if (hit((lx + rx) / 2, ty)) return 'tm'; if (hit((lx + rx) / 2, by)) return 'bm';
    if (hit(lx, (ty + by) / 2)) return 'ml'; if (hit(rx, (ty + by) / 2)) return 'mr';
    if (mx >= lx && mx <= rx && my >= ty && my <= by) return 'body';
  }
  if (d.type === 'fib') {
    const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price);
    const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price);
    if (hit(x1, y1)) return 'p1';
    if (hit(x2, y2)) return 'p2';
    if (x1 != null && x2 != null && y1 != null && y2 != null) {
      const lx = Math.min(x1, x2), rx = Math.max(x1, x2), ty = Math.min(y1, y2), by = Math.max(y1, y2);
      if (mx >= lx && mx <= rx && my >= ty && my <= by) return 'body';
    }
  }
  return null;
}

function applyDrag(d, orig, dprice, dtime, hitZone) {
  if (d.type === 'hline') { d.meta.price = orig.meta.price + dprice; }
  else if (d.type === 'vline') { d.meta.time = Math.round(orig.meta.time + dtime); }
  else if (d.type === 'trendline') {
    if (hitZone === 'p1') { d.meta.a = { price: orig.meta.a.price + dprice, time: Math.round(orig.meta.a.time + dtime) }; }
    else if (hitZone === 'p2') { d.meta.b = { price: orig.meta.b.price + dprice, time: Math.round(orig.meta.b.time + dtime) }; }
    else { d.meta.a = { price: orig.meta.a.price + dprice, time: Math.round(orig.meta.a.time + dtime) }; d.meta.b = { price: orig.meta.b.price + dprice, time: Math.round(orig.meta.b.time + dtime) }; }
    const pts = [d.meta.a, d.meta.b].sort((x, y) => x.time - y.time);
    try { d.series[0].setData([{ time: pts[0].time, value: pts[0].price }, { time: pts[1].time, value: pts[1].price }]); } catch (e) {}
  }
  else if (d.type === 'box') {
    const oa = orig.meta.a, ob = orig.meta.b;
    const hi = Math.max(oa.price, ob.price), lo = Math.min(oa.price, ob.price);
    const tL = Math.min(oa.time, ob.time), tR = Math.max(oa.time, ob.time);
    let newA = { ...oa }, newB = { ...ob };
    if (hitZone === 'body') { newA = { price: oa.price + dprice, time: Math.round(oa.time + dtime) }; newB = { price: ob.price + dprice, time: Math.round(ob.time + dtime) }; }
    else {
      if (hitZone === 'tl' || hitZone === 'ml' || hitZone === 'bl') newA.time = Math.round(tL + dtime);
      if (hitZone === 'tr' || hitZone === 'mr' || hitZone === 'br') newB.time = Math.round(tR + dtime);
      if (hitZone === 'tl' || hitZone === 'tm' || hitZone === 'tr') newA.price = hi + dprice;
      if (hitZone === 'bl' || hitZone === 'bm' || hitZone === 'br') newB.price = lo + dprice;
    }
    d.meta.a = newA; d.meta.b = newB;
    const nhi = Math.max(newA.price, newB.price), nlo = Math.min(newA.price, newB.price);
    const ntL = Math.min(newA.time, newB.time), ntR = Math.max(newA.time, newB.time);
    try { d.series[0].setData([{ time: ntL, value: nhi }, { time: ntR, value: nhi }]); d.series[1].setData([{ time: ntL, value: nlo }, { time: ntR, value: nlo }]); } catch (e) {}
  }
  else if (d.type === 'fib') {
    if (hitZone === 'p1') { d.meta.a = { price: orig.meta.a.price + dprice, time: Math.round(orig.meta.a.time + dtime) }; }
    else if (hitZone === 'p2') { d.meta.b = { price: orig.meta.b.price + dprice, time: Math.round(orig.meta.b.time + dtime) }; }
    else { d.meta.a = { price: orig.meta.a.price + dprice, time: Math.round(orig.meta.a.time + dtime) }; d.meta.b = { price: orig.meta.b.price + dprice, time: Math.round(orig.meta.b.time + dtime) }; }
    const hi = Math.max(d.meta.a.price, d.meta.b.price), lo = Math.min(d.meta.a.price, d.meta.b.price);
    const rng = hi - lo;
    const tL = Math.min(d.meta.a.time, d.meta.b.time), tR = Math.max(d.meta.a.time, d.meta.b.time);
    FIB_LEVELS.forEach((lvl, i) => { try { d.series[i].setData([{ time: tL, value: hi - rng * lvl.r }, { time: tR, value: hi - rng * lvl.r }]); } catch (e) {} });
  }
}

function getCanvasXY(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

canvas.addEventListener('mousedown', onDragStart);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDragStart(e); }, { passive: false });

function onDragStart(e) {
  if (selIdx < 0 || selIdx >= drawings.length) return;
  const { x, y } = getCanvasXY(e);
  const d = drawings[selIdx];
  const zone = hitHandle(d, x, y);
  if (!zone) { selIdx = -1; disableCanvasDrag(); scheduleRender(); sendToRN('DRAWING_DESELECTED', {}); return; }
  isDragging = true; dragStartX = x; dragStartY = y; dragHitType = zone;
  dragOriginal = JSON.parse(JSON.stringify(d));
  canvas.style.cursor = 'grabbing';
  e.preventDefault();
}

window.addEventListener('mousemove', onDragMove);
window.addEventListener('touchmove', e => { if (isDragging) { e.preventDefault(); onDragMove(e); } }, { passive: false });

function onDragMove(e) {
  if (!isDragging || selIdx < 0) return;
  const { x, y } = getCanvasXY(e);
  const dx = x - dragStartX, dy = y - dragStartY;
  const refPrice1 = pxToPrice(0), refPrice2 = pxToPrice(100);
  const refTime1 = pxToTime(0), refTime2 = pxToTime(100);
  if (refPrice1 == null || refPrice2 == null || refTime1 == null || refTime2 == null) return;
  const pricePerPx = (refPrice2 - refPrice1) / 100;
  const timePerPx = (refTime2 - refTime1) / 100;
  applyDrag(drawings[selIdx], dragOriginal, dy * pricePerPx, dx * timePerPx, dragHitType);
  scheduleRender();
}

window.addEventListener('mouseup', onDragEnd);
window.addEventListener('touchend', onDragEnd);

function onDragEnd() {
  if (!isDragging) return;
  isDragging = false; justDragged = true; canvas.style.cursor = 'grab';
  if (selIdx >= 0 && selIdx < drawings.length) {
    const d = drawings[selIdx];
    if (d.type === 'hline') {
      try { candleSeries.removePriceLine(d.pl); } catch (e) {}
      d.pl = candleSeries.createPriceLine({ price: d.meta.price, color: d.meta.color, lineWidth: d.meta.width, lineStyle: lwcLS(d.meta.style), axisLabelVisible: true, title: d.meta.price.toFixed(5) });
    }
  }
  dragOriginal = null;
  scheduleRender();
}

let drawings = [], selIdx = -1, isPlacing = false, p1Price = 0, p1Time = 0, crossPrice = null, crossTime = null;
let isDragging = false, justDragged = false, dragStartX = 0, dragStartY = 0, dragOriginal = null, dragHitType = null;

const TS = {
  trendline: { color: '#00e676', width: 2, style: 'solid' },
  hline: { color: '#00e5ff', width: 1, style: 'dashed' },
  vline: { color: '#3399ff', width: 1, style: 'dashed' },
  box: { color: '#ffab00', width: 2, style: 'solid' },
  fib: { color: '#00e676', width: 1, style: 'dashed' },
};

let _raf = null;
function scheduleRender() { if (_raf) return; _raf = requestAnimationFrame(() => { _raf = null; renderOverlay(); }); }
function lwcLS(s) { return s === 'dashed' ? 2 : s === 'dotted' ? 1 : 0; }

function setDash(style, w) {
  if (style === 'dashed') ctx.setLineDash([w * 6, w * 4]);
  else if (style === 'dotted') ctx.setLineDash([w * 2, w * 3]);
  else ctx.setLineDash([]);
}

function p2y(p) { return candleSeries.priceToCoordinate(p); }
function t2x(t) { return chart.timeScale().timeToCoordinate(t); }

function setTool(tool) {
  activeTool = tool; isPlacing = false; p1Price = 0; p1Time = 0; crossPrice = null; crossTime = null;
  scheduleRender();
}

chart.subscribeClick(param => {
  if (justDragged) { justDragged = false; return; }
  if (!param.point || !param.time) return;
  const price = candleSeries.coordinateToPrice(param.point.y);
  if (price == null || isNaN(price)) return;
  const time = param.time;
  if (activeTool === 'cursor') {
    selIdx = findNearest(param.point.x, param.point.y);
    if (selIdx >= 0) {
      enableCanvasDrag();
      const d = drawings[selIdx];
      const s = TS[d.type] || TS.trendline;
      sendToRN('DRAWING_SELECTED', { color: d.meta.color || s.color, width: d.meta.width || s.width, style: d.meta.style || s.style });
    } else { disableCanvasDrag(); sendToRN('DRAWING_DESELECTED', {}); }
    scheduleRender(); return;
  }
  const s = TS[activeTool];
  if (activeTool === 'hline') {
    const pl = candleSeries.createPriceLine({ price, color: s.color, lineWidth: s.width, lineStyle: lwcLS(s.style), axisLabelVisible: true, title: price.toFixed(5) });
    drawings.push({ type: 'hline', pl, meta: { price, color: s.color, width: s.width, style: s.style } });
    selIdx = drawings.length - 1; enableCanvasDrag(); scheduleRender(); return;
  }
  if (activeTool === 'vline') {
    drawings.push({ type: 'vline', meta: { time, color: s.color, width: s.width, style: s.style } });
    selIdx = drawings.length - 1; enableCanvasDrag(); scheduleRender(); return;
  }
  if (!isPlacing) { isPlacing = true; p1Price = price; p1Time = time; scheduleRender(); }
  else {
    isPlacing = false; const a = { price: p1Price, time: p1Time }; const b = { price, time };
    p1Price = 0; p1Time = 0; crossPrice = null; crossTime = null;
    if (activeTool === 'trendline') doTrendline(a, b, s);
    else if (activeTool === 'box') doBox(a, b, s);
    else if (activeTool === 'fib') doFib(a, b, s);
    scheduleRender();
  }
});

chart.subscribeCrosshairMove(param => {
  if (!isPlacing || activeTool === 'cursor') return;
  if (!param.point || !param.time) return;
  const price = candleSeries.coordinateToPrice(param.point.y);
  if (price == null) return;
  crossPrice = price; crossTime = param.time;
  scheduleRender();
});

function findNearest(px, py) {
  const HIT = 10;
  for (let i = drawings.length - 1; i >= 0; i--) {
    const d = drawings[i];
    if (d.type === 'hline') { const y = p2y(d.meta.price); if (y == null) continue; if (Math.abs(py - y) < HIT) return i; }
    else if (d.type === 'vline') { const x = t2x(d.meta.time); if (x == null) continue; if (Math.abs(px - x) < HIT) return i; }
    else if (d.meta && d.meta.a && d.meta.b) {
      const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price);
      const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price);
      if (x1 == null || x2 == null || y1 == null || y2 == null) continue;
      if (segDist(px, py, x1, y1, x2, y2) < HIT) return i;
    }
  }
  return -1;
}
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function makeSer(s) {
  return chart.addLineSeries({ color: s.color, lineWidth: s.width, lineStyle: lwcLS(s.style), priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
}

function doTrendline(a, b, s) {
  const ser = makeSer(s);
  const pts = [a, b].sort((x, y) => x.time - y.time);
  ser.setData([{ time: pts[0].time, value: pts[0].price }, { time: pts[1].time, value: pts[1].price }]);
  drawings.push({ type: 'trendline', series: [ser], meta: { a, b, color: s.color, width: s.width, style: s.style } });
  selIdx = drawings.length - 1; enableCanvasDrag();
}

function doBox(a, b, s) {
  const hi = Math.max(a.price, b.price), lo = Math.min(a.price, b.price);
  const tL = Math.min(a.time, b.time), tR = Math.max(a.time, b.time);
  const sers = [[hi, hi], [lo, lo]].map(v => { const ser = makeSer(s); ser.setData([{ time: tL, value: v[0] }, { time: tR, value: v[1] }]); return ser; });
  drawings.push({ type: 'box', series: sers, meta: { a, b, color: s.color, width: s.width, style: s.style } });
  selIdx = drawings.length - 1;
}

const FIB_LEVELS = [
  { r: 0, color: '#00e5ff', label: '0.000' }, { r: 0.236, color: '#bb86fc', label: '0.236' },
  { r: 0.382, color: '#ffab00', label: '0.382' }, { r: 0.5, color: '#e0e0e0', label: '0.500' },
  { r: 0.618, color: '#00e676', label: '0.618' }, { r: 0.786, color: '#ff6d00', label: '0.786' },
  { r: 1, color: '#ff1744', label: '1.000' }
];

function doFib(a, b, s) {
  const hi = Math.max(a.price, b.price), lo = Math.min(a.price, b.price), rng = hi - lo;
  const tL = Math.min(a.time, b.time), tR = Math.max(a.time, b.time);
  const sers = FIB_LEVELS.map(lvl => {
    const ser = chart.addLineSeries({ color: lvl.color, lineWidth: s.width, lineStyle: lwcLS(s.style), priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, title: lvl.label });
    ser.setData([{ time: tL, value: hi - rng * lvl.r }, { time: tR, value: hi - rng * lvl.r }]);
    return ser;
  });
  showFibLegend(a.price, b.price);
  drawings.push({ type: 'fib', series: sers, meta: { a, b, color: s.color, width: s.width, style: s.style } });
  selIdx = drawings.length - 1;
}

function showFibLegend(pp1, pp2) {
  const hi = Math.max(pp1, pp2), lo = Math.min(pp1, pp2), rng = hi - lo;
  const leg = document.getElementById('fib-legend'); leg.style.display = 'block';
  leg.innerHTML = '<div style="color:var(--muted);font-size:9px;margin-bottom:5px;letter-spacing:1px;">FIB LEVELS</div>' +
    FIB_LEVELS.map(l => `<div class="fib-row"><div class="fib-swatch" style="background:${l.color}"></div><span style="color:${l.color}">${l.label}</span><span style="color:var(--text)">${(hi - rng * l.r).toFixed(5)}</span></div>`).join('');
}

function renderOverlay() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawings.forEach((d, i) => {
    const isSel = (i === selIdx);
    if (d.type === 'hline' && isSel && isDragging) {
      const y = p2y(d.meta.price); if (y == null) return;
      ctx.save(); ctx.strokeStyle = d.meta.color; ctx.lineWidth = (d.meta.width || 1) + 1; ctx.setLineDash([8, 4]);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = d.meta.color; ctx.font = '11px monospace'; ctx.fillText(d.meta.price.toFixed(5), 4, y - 4); ctx.restore(); return;
    }
    if (d.type === 'vline') {
      const x = t2x(d.meta.time); if (x == null) return;
      ctx.save(); ctx.strokeStyle = isSel ? '#ffffff' : d.meta.color; ctx.lineWidth = d.meta.width; setDash(d.meta.style, d.meta.width);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); ctx.setLineDash([]);
      if (isSel) { drawHandle(x, canvas.height / 2); drawHandle(x, 10); drawHandle(x, canvas.height - 10); }
      ctx.restore();
    }
    if (d.type === 'box') {
      const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price);
      const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price);
      if (x1 == null || x2 == null || y1 == null || y2 == null) return;
      const lx = Math.min(x1, x2), rx = Math.max(x1, x2), ty = Math.min(y1, y2), by = Math.max(y1, y2);
      ctx.save(); ctx.fillStyle = d.meta.color + '18'; ctx.fillRect(lx, ty, rx - lx, by - ty);
      ctx.strokeStyle = isSel ? '#ffffff' : d.meta.color; ctx.lineWidth = d.meta.width; setDash(d.meta.style, d.meta.width);
      ctx.beginPath(); ctx.moveTo(lx, ty); ctx.lineTo(lx, by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx, ty); ctx.lineTo(rx, by); ctx.stroke(); ctx.setLineDash([]);
      if (isSel) { drawHandle(lx, ty); drawHandle(rx, ty); drawHandle(lx, by); drawHandle(rx, by); drawHandle((lx + rx) / 2, ty); drawHandle((lx + rx) / 2, by); drawHandle(lx, (ty + by) / 2); drawHandle(rx, (ty + by) / 2); }
      ctx.restore();
    }
    if (d.type === 'trendline' && isSel) { const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price); const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price); if (x1 != null && y1 != null) drawHandle(x1, y1); if (x2 != null && y2 != null) drawHandle(x2, y2); }
    if (d.type === 'hline' && isSel) { const y = p2y(d.meta.price); if (y == null) return; drawHandle(canvas.width / 2, y); drawHandle(canvas.width * 0.25, y); drawHandle(canvas.width * 0.75, y); }
    if (d.type === 'fib' && isSel) { const x1 = t2x(d.meta.a.time), y1 = p2y(d.meta.a.price); const x2 = t2x(d.meta.b.time), y2 = p2y(d.meta.b.price); if (x1 != null && y1 != null) drawHandle(x1, y1); if (x2 != null && y2 != null) drawHandle(x2, y2); }
  });
  if (isPlacing && crossPrice != null && crossTime != null && p1Time > 0) {
    const ax = t2x(p1Time), ay = p2y(p1Price);
    const bx = t2x(crossTime), by = p2y(crossPrice);
    if (ax != null && ay != null && bx != null && by != null) {
      const s = TS[activeTool]; ctx.save(); ctx.strokeStyle = s.color; ctx.lineWidth = s.width; ctx.globalAlpha = 0.65; setDash(s.style, s.width);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 1; ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(ax, ay, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }
}

function drawHandle(x, y) {
  ctx.save(); ctx.fillStyle = '#1a1a2e'; ctx.strokeStyle = '#3399ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
}

chart.timeScale().subscribeVisibleTimeRangeChange(() => scheduleRender());
chart.subscribeCrosshairMove(() => { if (isPlacing) scheduleRender(); });

function deleteSelected() {
  if (selIdx < 0 || selIdx >= drawings.length) return;
  const d = drawings[selIdx];
  if (d.series) d.series.forEach(s => { try { chart.removeSeries(s); } catch (e) {} });
  if (d.pl) { try { candleSeries.removePriceLine(d.pl); } catch (e) {} }
  drawings.splice(selIdx, 1); selIdx = -1;
  disableCanvasDrag(); scheduleRender();
  sendToRN('DRAWING_DESELECTED', {});
  toast('Drawing deleted', 'amber');
}

function duplicateSelected() {
  if (selIdx < 0 || selIdx >= drawings.length) return;
  const d = drawings[selIdx], s = { color: d.meta.color, width: d.meta.width, style: d.meta.style || 'solid' };
  if (d.type === 'hline') { const np = d.meta.price + 0.001; const pl = candleSeries.createPriceLine({ price: np, color: s.color, lineWidth: s.width, lineStyle: lwcLS(s.style), axisLabelVisible: true, title: np.toFixed(5) }); drawings.push({ type: 'hline', pl, meta: { price: np, ...s } }); }
  else if (d.type === 'vline') drawings.push({ type: 'vline', meta: { ...d.meta, time: d.meta.time + 300 } });
  else if (d.type === 'trendline') doTrendline({ price: d.meta.a.price + 0.001, time: d.meta.a.time }, { price: d.meta.b.price + 0.001, time: d.meta.b.time }, s);
  else if (d.type === 'box') doBox({ price: d.meta.a.price + 0.001, time: d.meta.a.time }, { price: d.meta.b.price + 0.001, time: d.meta.b.time }, s);
  else if (d.type === 'fib') doFib({ price: d.meta.a.price + 0.001, time: d.meta.a.time }, { price: d.meta.b.price + 0.001, time: d.meta.b.time }, s);
  scheduleRender();
}

function clearDrawings() {
  drawings.forEach(d => { if (d.series) d.series.forEach(s => { try { chart.removeSeries(s); } catch (e) {} }); if (d.pl) { try { candleSeries.removePriceLine(d.pl); } catch (e) {} } });
  drawings = []; selIdx = -1; isPlacing = false; disableCanvasDrag(); p1Price = 0; p1Time = 0; crossPrice = null; crossTime = null;
  document.getElementById('fib-legend').style.display = 'none'; scheduleRender();
  sendToRN('DRAWING_DESELECTED', {});
  toast('Drawings cleared', 'amber');
}

function gotoLatest() { if (!bars.length) return; currentIndex = bars.length; updateChart(); toast('Jumped to latest bar', 'cyan'); }
function checkGotoBtn() {
  const btn = document.getElementById('goto-btn'); if (!btn || !bars.length) return;
  if (currentIndex < bars.length) btn.classList.add('visible'); else btn.classList.remove('visible');
}

// MOCK DATA
function generateMock() {
  const d = []; let t = 1700000000, price = 1.0890;
  for (let i = 0; i < 500; i++) {
    const move = (Math.random() - .49) * .0008, open = price, close = +(open + move).toFixed(5);
    const high = +(Math.max(open, close) + Math.random() * .0003).toFixed(5);
    const low = +(Math.min(open, close) - Math.random() * .0003).toFixed(5);
    d.push({ time: t, open, high, low, close }); price = close; t += 60;
  }
  return d;
}

// CSV PARSER
function parseCSVText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (!lines.length) return [];
  const sep = lines[0].includes(';') ? ';' : ',';
  const firstLower = lines[0].toLowerCase();
  const hasHeader = firstLower.startsWith('date') || firstLower.startsWith('"date') || firstLower.includes('open') || firstLower.includes('time');
  const dataLines = hasHeader ? lines.slice(1) : lines;

  function parseDate(raw) {
    const s = raw.trim().replace(/^"|"$/g, '');
    if (/^\d{8} \d{6}$/.test(s)) {
      const yr = s.slice(0, 4), mo = s.slice(4, 6), dy = s.slice(6, 8), hr = s.slice(9, 11), mn = s.slice(11, 13), sc = s.slice(13, 15);
      return Math.floor(Date.parse(`${yr}-${mo}-${dy}T${hr}:${mn}:${sc}Z`) / 1000);
    }
    if (/^\d{8}$/.test(s)) { const yr = s.slice(0, 4), mo = s.slice(4, 6), dy = s.slice(6, 8); return Math.floor(Date.parse(`${yr}-${mo}-${dy}T00:00:00Z`) / 1000); }
    if (s.includes('T')) { const ts = Date.parse(s.endsWith('Z') ? s : s + 'Z'); return isNaN(ts) ? NaN : Math.floor(ts / 1000); }
    const fixed = s.replace(' ', 'T') + (s.length <= 10 ? 'T00:00:00Z' : 'Z');
    const ts = Date.parse(fixed); return isNaN(ts) ? NaN : Math.floor(ts / 1000);
  }

  const seen = new Set();
  return dataLines.map(line => {
    let clean = line;
    if (clean.startsWith('"')) clean = clean.replace(/^"|"$/g, '').split('","')[0];
    const parts = clean.split(sep); if (parts.length < 5) return null;
    let dateStr = parts[0].trim(), ohlcOffset = 1;
    const p1 = parts[1] ? parts[1].trim() : '';
    if (/^\d{2}:\d{2}/.test(p1) || /^\d{6}$/.test(p1)) { dateStr = dateStr + ' ' + p1; ohlcOffset = 2; }
    const ts = parseDate(dateStr); if (isNaN(ts) || ts <= 0) return null;
    const open = parseFloat(parts[ohlcOffset]), high = parseFloat(parts[ohlcOffset + 1]);
    const low = parseFloat(parts[ohlcOffset + 2]), close = parseFloat(parts[ohlcOffset + 3]);
    if (isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close)) return null;
    return { time: ts, open, high, low, close };
  }).filter(b => b !== null).sort((a, b) => a.time - b.time).filter(b => { if (seen.has(b.time)) return false; seen.add(b.time); return true; });
}

function getYearRange(bars) {
  if (!bars.length) return 'Unknown';
  const y1 = new Date(bars[0].time * 1000).getUTCFullYear();
  const y2 = new Date(bars[bars.length - 1].time * 1000).getUTCFullYear();
  return y1 === y2 ? `${y1}` : `${y1}–${y2}`;
}

function detectAssetFromFilename(filename) {
  const f = filename.toUpperCase().replace('.CSV', '');
  for (const cat of CATEGORIES) for (const pair of Object.keys(assetDB[cat])) {
    const clean = pair.replace(/[^A-Z0-9]/g, '');
    if (f.includes(clean)) return { cat, pair };
  }
  return null;
}

// DATASET MANAGEMENT
function addDatasetToAsset(cat, pair, yearRange, bars, label) {
  if (!assetDB[cat]) assetDB[cat] = {};
  if (!assetDB[cat][pair]) assetDB[cat][pair] = [];
  const id = Date.now();
  const stored = bars.map(b => [b.time, b.open, b.high, b.low, b.close]);
  try { localStorage.setItem('bp_bars_' + id, JSON.stringify(stored)); } catch (e) { toast('Storage full', 'amber'); }
  assetDB[cat][pair].push({ id, label: label || yearRange, yearRange, barCount: bars.length });
  saveAssets();
}

function loadDatasetById(id, assetName) {
  try {
    const raw = localStorage.getItem('bp_bars_' + id);
    if (!raw) { toast('Data not found', 'red'); return; }
    const arr = JSON.parse(raw);
    const bars = arr.map(b => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4] }));
    loadBarsIntoChart(bars, assetName); toast(`Loaded ${assetName}`, 'green');
  } catch (e) { toast('Failed to load data', 'red'); }
}

function deleteDataset(cat, pair, id) {
  assetDB[cat][pair] = assetDB[cat][pair].filter(d => d.id !== id);
  try { localStorage.removeItem('bp_bars_' + id); } catch (e) {}
  saveAssets(); toast('Dataset deleted', 'amber');
}

function loadBarsIntoChart(newBars, assetName) {
  rawBars = newBars; currentAssetName = assetName || 'CUSTOM';
  bars = [...rawBars]; currentIndex = Math.min(50, bars.length);
  currentTf = 1; updateChart();
}

function handleLoadedCSV(csvText, filename) {
  const parsed = parseCSVText(csvText);
  if (!parsed.length) { toast('Could not parse CSV', 'red'); return; }
  const yearRange = getYearRange(parsed);
  const detected = detectAssetFromFilename(filename);
  const fname = filename.replace(/\.csv$/i, '');
  if (detected) { addDatasetToAsset(detected.cat, detected.pair, yearRange, parsed, fname); toast(`Saved to ${detected.cat} › ${detected.pair}`, 'green'); }
  else { addDatasetToAsset('FOREX', 'EURUSD', yearRange, parsed, fname); toast(`Saved to FOREX › EURUSD`, 'green'); }
  loadBarsIntoChart(parsed, fname);
}

// STARTUP
async function init() {
  resizeCanvas(); loadStorage();
  try { await loadCSV(); }
  catch (e) {
    rawBars = generateMock(); currentAssetName = 'MOCK';
    finishLoad('Mock dataset (500 bars)');
  }
  setTimeout(() => { sendToRN('APP_READY', {}); }, 500);
}

async function loadCSV() {
  const res = await fetch('data.csv'); if (!res.ok) throw new Error('no file');
  const text = await res.text();
  const parsed = parseCSVText(text); if (!parsed.length) throw new Error('empty');
  rawBars = parsed; currentAssetName = 'data.csv';
  finishLoad(`${rawBars.length} bars from data.csv`);
}

function finishLoad(msg) {
  bars = [...rawBars]; currentIndex = Math.min(50, bars.length);
  updateChart();
}

// CHART UPDATE
function updateChart() {
  if (!bars.length) return;
  currentIndex = Math.max(1, Math.min(currentIndex, bars.length));
  candleSeries.setData(bars.slice(0, currentIndex));
  redrawMarkers();
  setTimeout(() => { chart.timeScale().fitContent(); scheduleRender(); checkGotoBtn(); }, 50);
  const bar = bars[currentIndex - 1], price = bar.close;
  let change = '+0.0%', changeColor = '#00e676';
  if (currentIndex > 1) {
    const prev = bars[currentIndex - 2].close, chg = ((price - prev) / prev * 100).toFixed(3);
    change = (chg >= 0 ? '+' : '') + chg + '%'; changeColor = chg >= 0 ? '#00e676' : '#ff1744';
  }
  sendToRN('PRICE_UPDATE', { price: price.toFixed(5), change, changeColor });
  sendToRN('BAR_COUNTER', { counter: currentIndex + ' / ' + bars.length, showGoto: currentIndex < bars.length });
  updateOpenPnl(price);
}

function redrawMarkers() {
  const markers = [];
  trades.forEach(t => {
    if (t.entryIndex <= currentIndex) markers.push({ time: bars[t.entryIndex - 1].time, position: t.type === 'BUY' ? 'belowBar' : 'aboveBar', color: t.type === 'BUY' ? '#00e676' : '#ff1744', shape: t.type === 'BUY' ? 'arrowUp' : 'arrowDown', text: t.type === 'BUY' ? '▲B' : '▼S' });
    if (t.exitIndex && t.exitIndex <= currentIndex) markers.push({ time: bars[t.exitIndex - 1].time, position: t.type === 'BUY' ? 'aboveBar' : 'belowBar', color: '#ffab00', shape: 'circle', text: 'X' });
  });
  if (currentPosition) markers.push({ time: bars[currentPosition.entryIndex - 1].time, position: currentPosition.type === 'BUY' ? 'belowBar' : 'aboveBar', color: currentPosition.type === 'BUY' ? '#00e676' : '#ff1744', shape: currentPosition.type === 'BUY' ? 'arrowUp' : 'arrowDown', text: currentPosition.type === 'BUY' ? '▲B' : '▼S' });
  markers.sort((a, b) => a.time - b.time);
  candleSeries.setMarkers(markers);
}

function nextBar() { if (currentIndex < bars.length) { currentIndex++; updateChart(); } else toast('End of data', 'amber'); checkGotoBtn(); }
function prevBar() { if (currentIndex > 1) { currentIndex--; updateChart(); } checkGotoBtn(); }

// TIMEFRAME
function setTimeframe(minutes) {
  if (!rawBars.length) return;
  currentTf = minutes;
  if (minutes === 1) {
    const seen = new Set();
    bars = rawBars.filter(b => { if (seen.has(b.time)) return false; seen.add(b.time); return true; });
    currentIndex = Math.min(currentIndex, bars.length); updateChart(); return;
  }
  const intv = minutes * 60; bars = [];
  let chunk = [], chunkStart = Math.floor(rawBars[0].time / intv) * intv;
  for (const bar of rawBars) {
    if (bar.time < chunkStart + intv) chunk.push(bar);
    else { if (chunk.length) pushAgg(chunk, chunkStart); chunk = [bar]; chunkStart = Math.floor(bar.time / intv) * intv; }
  }
  if (chunk.length) pushAgg(chunk, chunkStart);
  currentIndex = Math.min(currentIndex, bars.length); updateChart();
}
function pushAgg(chunk, t) { bars.push({ time: t, open: chunk[0].open, high: Math.max(...chunk.map(b => b.high)), low: Math.min(...chunk.map(b => b.low)), close: chunk[chunk.length - 1].close }); }

// TRADE ENGINE
function openTrade(type) {
  if (currentPosition) { toast('Close current trade first!', 'amber'); return; }
  const price = bars[currentIndex - 1].close;
  const lotSize = 0.1;
  currentPosition = { type, entryPrice: price, entryIndex: currentIndex, lotSize, asset: currentAssetName };
  sendToRN('TRADE_OPENED', { type, price, lotSize });
  redrawMarkers(); toast(`${type} ${lotSize} lot @ ${price.toFixed(5)}`, type === 'BUY' ? 'green' : 'red');
}

function closeTrade() {
  if (!currentPosition) { toast('No open trade to close.', 'amber'); return; }
  const exitPrice = bars[currentIndex - 1].close;
  const rawDiff = currentPosition.type === 'BUY' ? exitPrice - currentPosition.entryPrice : currentPosition.entryPrice - exitPrice;
  const pips = rawDiff / PIP_SIZE, usdPnl = pips * PIP_VALUE_PER_LOT * currentPosition.lotSize;
  const trade = { id: trades.length + 1, type: currentPosition.type, entryPrice: currentPosition.entryPrice, exitPrice, entryIndex: currentPosition.entryIndex, exitIndex: currentIndex, lotSize: currentPosition.lotSize, pips: +pips.toFixed(1), usdPnl: +usdPnl.toFixed(2), win: usdPnl > 0, asset: currentPosition.asset || currentAssetName, date: new Date(bars[currentIndex - 1].time * 1000).toISOString().slice(0, 10), note: '' };
  trades.push(trade); currentPosition = null;
  sendToRN('TRADE_CLOSED', { trade });
  updateStats(); redrawMarkers(); saveTrades();
  toast(`Closed: ${trade.pips > 0 ? '+' : ''}${trade.pips} pips | ${trade.usdPnl >= 0 ? '+$' : '-$'}${Math.abs(trade.usdPnl).toFixed(2)}`, trade.win ? 'green' : 'red');
}

function updateOpenPnl(price) {
  if (!currentPosition) return;
  const rawDiff = currentPosition.type === 'BUY' ? price - currentPosition.entryPrice : currentPosition.entryPrice - price;
  const pips = rawDiff / PIP_SIZE;
  const usdPnl = pips * PIP_VALUE_PER_LOT * currentPosition.lotSize;
  sendToRN('STATS_UPDATE', {
    ...getCurrentStats(),
    openPnlPips: (pips >= 0 ? '+' : '') + pips.toFixed(1),
    openPnlUsd: (usdPnl >= 0 ? '+$' : '-$') + Math.abs(usdPnl).toFixed(2),
  });
}

function updateStats() {
  if (!trades.length) return;
  const totalUsd = trades.reduce((s, t) => s + t.usdPnl, 0);
  const wins = trades.filter(t => t.win).length;
  const wr = trades.length > 0 ? (wins / trades.length * 100).toFixed(1) : '—';
  sendToRN('STATS_UPDATE', {
    totalPnl: totalUsd,
    winRate: wr + '%',
    tradeCount: trades.length,
    openPnlPips: currentPosition ? '—' : '—',
    openPnlUsd: currentPosition ? '—' : '—',
    barCounter: currentIndex + ' / ' + bars.length,
  });
}

function getCurrentStats() {
  const totalUsd = trades.reduce((s, t) => s + t.usdPnl, 0);
  const wins = trades.filter(t => t.win).length;
  const wr = trades.length > 0 ? (wins / trades.length * 100).toFixed(1) : '—';
  return { totalPnl: totalUsd, winRate: wr + '%', tradeCount: trades.length, barCounter: currentIndex + ' / ' + bars.length };
}

function clearTrades() {
  trades = []; currentPosition = null;
  updateStats(); redrawMarkers(); saveTrades();
  sendToRN('TRADES_CLEARED', {});
  toast('Trade history cleared', 'amber');
}

// TOAST
function toast(msg, type) {
  console.log('Toast:', msg, type);
  const colorMap = { 'green': '#00e676', 'red': '#ff1744', 'amber': '#ffab00', 'purple': '#bb86fc', 'cyan': '#00e5ff', '': '#00e5ff' };
  sendToRN('TOAST', { message: msg, color: colorMap[type] || '#00e5ff' });
}

window.addEventListener('DOMContentLoaded', init);
</script>
