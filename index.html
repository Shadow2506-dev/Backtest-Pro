<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backtest Pro</title>
  <!-- Sourced securely via standalone CDN -->
  <script src="https://unpkg.com"></script>
</head>

<body style="background:black; color:white; font-family: sans-serif; padding: 15px; margin: 0;">

<h2>Backtest Pro</h2>

<!-- System Status Debug Text Container -->
<p id="status" style="color: yellow; font-size: 13px; margin: 5px 0;">System Status: Loading Assets...</p>

<!-- Chart target container -->
<div id="chart" style="height:300px; width: 100%; background: #000;"></div>

<div style="margin: 15px 0;">
  <button onclick="prevBar()" style="padding: 8px 12px;">◀</button>
  <button onclick="nextBar()" style="padding: 8px 12px;">▶</button>
  <button onclick="buy()" style="background: green; color: white; padding: 8px 12px; border: none; font-weight: bold;">BUY</button>
  <button onclick="sell()" style="background: red; color: white; padding: 8px 12px; border: none; font-weight: bold;">SELL</button>
  <button onclick="closeTrade()" style="background: gray; color: white; padding: 8px 12px; border: none; font-weight: bold;">CLOSE</button>
</div>
  
<p id="price">Price: -</p>
<p id="profit">Profit: -</p>
<p id="winrate">Win Rate: -</p>

<div style="margin-top: 15px;">
  <button onclick="setTimeframe(1)">1m</button>
  <button onclick="setTimeframe(5)">5m</button>
  <button onclick="setTimeframe(15)">15m</button>
  <button onclick="setTimeframe(60)">1H</button>
</div>
 
<script>
// ===== STATE STORAGE =====
let rawBars = [];   
let bars = [];      
let currentIndex = 1;

// Trade Records
let currentPosition = null; 
let trades = [];            

// ===== INITIALIZE CHART ENGINE =====
const chartContainer = document.getElementById('chart');

const getTargetWidth = () => {
    const parentWidth = chartContainer.getBoundingClientRect().width;
    return parentWidth > 0 ? parentWidth : (window.innerWidth - 30);
};

const chart = LightweightCharts.createChart(chartContainer, {
    width: getTargetWidth(),
    height: 300,
    layout: { background: { color: '#000000' }, textColor: '#ffffff' },
    grid: { vertLines: { color: '#111111' }, horzLines: { color: '#111111' } },
    timeScale: { timeVisible: true, secondsVisible: false }
});

const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
});

window.addEventListener('resize', () => {
    chart.resize(getTargetWidth(), 300);
});

// ===== FIXED MOCK DATA (Uses correct UNIX Timestamps) =====
const mockData = [
  { time: 1777593600, open: 1.0890, high: 1.0895, low: 1.0888, close: 1.0892 },
  { time: 1777593660, open: 1.0892, high: 1.0898, low: 1.0891, close: 1.0897 },
  { time: 1777593720, open: 1.0897, high: 1.0902, low: 1.0895, close: 1.0900 },
  { time: 1777593780, open: 1.0900, high: 1.0905, low: 1.0898, close: 1.0903 }
];

// ===== SYSTEM STARTUP PROCEDURES =====
async function init() {
    try {
        await loadCSV();
    } catch (e) {
        console.warn("CSV parser error, using mock fallback data.", e);
        document.getElementById("status").innerText = "Status: data.csv error! Running Mock Dataset.";
        rawBars = [...mockData];
        bars = [...rawBars];
        currentIndex = Math.min(4, bars.length);
        updateChart();
    }
}

// ===== LOCAL CSV PARSE ENGINE =====
async function loadCSV() {
    let response = await fetch("data.csv"); 
    if (!response.ok) throw new Error("Network data file mismatch");
    let text = await response.text();

    let lines = text.split("\n");
    let startIndex = 0;
    
    for(let i = 0; i < lines.length; i++) {
        let cleanLine = lines[i].toLowerCase().trim();
        if(cleanLine.startsWith("date") || cleanLine.includes("open")) {
            startIndex = i + 1;
            break;
        }
    }

    rawBars = lines.slice(startIndex).filter(line => line.trim() !== "").map(line => {
        let parts = line.split(",");
        if (parts.length < 5) return null;
        
        let dateStr = parts[0];
        let open = parts[1];
        let high = parts[2];
        let low = parts[3];
        let close = parts[4];
        
        let timestampSeconds = Math.floor(Date.parse(dateStr.trim().replace(" ", "T")) / 1000);
        if (isNaN(timestampSeconds)) return null;

        return {
            time: timestampSeconds,
            open: parseFloat(open),
            high: parseFloat(high),
            low: parseFloat(low),
            close: parseFloat(close)
        };
    }).filter(item => item !== null);

    if (rawBars.length === 0) throw new Error("No data parsed");

    rawBars.sort((a, b) => a.time - b.time);

    document.getElementById("status").innerText = `Status: Loaded ${rawBars.length} bars from data.csv successfully!`;
    bars = [...rawBars];
    currentIndex = Math.min(4, bars.length); 
    updateChart();
}

// ===== DISPLAY & INTERACTION SYSTEMS =====
function updateChart() {
    if (!bars || bars.length === 0) return;
    
    if (currentIndex > bars.length) currentIndex = bars.length;
    if (currentIndex < 1) currentIndex = 1;

    const visibleBars = bars.slice(0, currentIndex);
    candleSeries.setData(visibleBars);
    
    setTimeout(() => {
        chart.timeScale().fitContent();
    }, 50);

    let currentBar = bars[currentIndex - 1];
    let price = currentBar ? currentBar.close : 0;
    document.getElementById("price").innerText = "Price: " + price.toFixed(5);

    calculateOpenProfit(price);
}

function nextBar() {
    if (currentIndex < bars.length) {
        currentIndex++;
        updateChart();
    }
}

function prevBar() {
    if (currentIndex > 1) {
        currentIndex--;
        updateChart();
    }
}

// ===== TIMEFRAME AGGREGATION MECHANICS (FIXED CRITICAL ERROR) =====
function setTimeframe(minutes) {
    if (!rawBars || rawBars.length === 0) return;
    bars = [];
    const intervalSeconds = minutes * 60;

    let currentChunk = [];
    // Fix: Grab structural index position pointer correctly instead of undefined root variable property
    let currentChunkStart = Math.floor(rawBars[0].time / intervalSeconds) * intervalSeconds;

    for (let i = 0; i < rawBars.length; i++) {
        let bar = rawBars[i];
        if (bar.time < currentChunkStart + intervalSeconds) {
            currentChunk.push(bar);
        } else {
            if (currentChunk.length > 0) {
                bars.push({
                    time: currentChunkStart,
                    open: currentChunk[0].open,
                    high: Math.max(...currentChunk.map(b => b.high)),
                    low: Math.min(...currentChunk.map(b => b.low)),
                    close: currentChunk[currentChunk.length - 1].close
                });
            }
            currentChunk = [bar];
            currentChunkStart = Math.floor(bar.time / intervalSeconds) * intervalSeconds;
        }
    }
    
    if (currentChunk.length > 0) {
        bars.push({
            time: currentChunkStart,
            open: currentChunk[0].open,
            high: Math.max(...currentChunk.map(b => b.high)),
            low: Math.min(...currentChunk.map(b => b.low)),
            close: currentChunk[currentChunk.length - 1].close
        });
    }

    currentIndex = bars.length; 
    updateChart();
}

// ===== TRADE ENGINE EXECUTION =====
function buy() {
    if (currentPosition) return alert("Close your current trade first!");
    let price = bars[currentIndex - 1].close;
    currentPosition = { type: 'BUY', entryPrice: price };
    alert(`Opened BUY position at ${price.toFixed(5)}`);
}

function sell() {
    if (currentPosition) return alert("Close your current trade first!");
    let price = bars[currentIndex - 1].close;
    currentPosition = { type: 'SELL', entryPrice: price };
    alert(`Opened SELL position at ${price.toFixed(5)}`);
}

// Fixed performance calculation updates
function closeTrade() {
    if (!currentPosition) return alert("No active trades to close.");
    let exitPrice = bars[currentIndex - 1].close;
    let profit = 0;

    if (currentPosition.type === 'BUY') {
        profit = exitPrice - currentPosition.entryPrice;
    } else {
        profit = currentPosition.entryPrice - exitPrice;
    }

    trades.push({ profit: profit, win: profit > 0 });
    currentPosition = null;
    
    updatePerformanceStats();
    updateChart();
}

function calculateOpenProfit(currentPrice) {
    if (!currentPosition) {
        document.getElementById("profit").innerText = "Profit: -";
        return;
    }
    let openProfit = currentPosition.type === 'BUY' 
        ? currentPrice - currentPosition.entryPrice 
        : currentPosition.entryPrice - currentPrice;
        
    document.getElementById("profit").innerText = `Open Profit: ${openProfit.toFixed(5)} (${currentPosition.type})`;
}

function updatePerformanceStats() {
    if (trades.length === 0) return;
    
    let totalProfit = trades.reduce((sum, t) => sum + t.profit, 0);
    let wins = trades.filter(t => t.win).length;
    let winRate = (wins / trades.length) * 100;

    document.getElementById("winrate").innerText = `Win Rate: ${winRate.toFixed(1)}% (${trades.length} trades)`;
    alert(`Trade Closed. Net PnL: ${totalProfit.toFixed(5)}`);
}

window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
