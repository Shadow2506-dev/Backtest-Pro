<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Backtest Pro</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #090b0f;
      --panel:     #0d1117;
      --border:    #1a2233;
      --accent:    #00e5ff;
      --green:     #00e676;
      --red:       #ff1744;
      --amber:     #ffab00;
      --purple:    #bb86fc;
      --text:      #c9d1d9;
      --muted:     #4a5568;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui:   'Rajdhani', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* HEADER */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky; top: 0; z-index: 200;
    }
    .logo { font-family: var(--font-mono); font-size: 16px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
    .logo span { color: var(--text); }
    #status-badge {
      font-family: var(--font-mono); font-size: 10px;
      padding: 3px 8px; border-radius: 3px;
      border: 1px solid var(--muted); color: var(--muted); transition: all .3s;
    }
    #status-badge.ok    { border-color: var(--green); color: var(--green); }
    #status-badge.error { border-color: var(--red);   color: var(--red);   }
    #status-badge.warn  { border-color: var(--amber); color: var(--amber); }

    /* TICKER */
    .ticker-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: #0a0d12;
    }
    #price-display { font-family: var(--font-mono); font-size: 22px; color: var(--accent); letter-spacing: 1px; }
    #price-change  { font-family: var(--font-mono); font-size: 12px; padding: 2px 6px; border-radius: 3px; }
    #position-badge {
      margin-left: auto; font-family: var(--font-mono); font-size: 11px;
      padding: 3px 9px; border-radius: 3px; display: none;
    }
    #position-badge.long  { background: rgba(0,230,118,.15); color: var(--green); border: 1px solid var(--green); }
    #position-badge.short { background: rgba(255,23,68,.15);  color: var(--red);   border: 1px solid var(--red);   }

    /* CHART WRAPPER */
    #chart-wrap {
      position: relative; width: 100%; background: var(--bg);
      touch-action: none;
    }
    #chart { width: 100%; height: 380px; }

    /* DRAWING OVERLAY CANVAS */
    #draw-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 380px;
      pointer-events: none;
      z-index: 10;
    }
    #draw-canvas.active { pointer-events: all; cursor: crosshair; }

    /* TOOLBAR */
    .toolbar {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: #0a0d12;
    }
    .tool-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
    .tool-btn {
      font-family: var(--font-mono); font-size: 11px;
      border: 1px solid var(--border); background: #111822;
      color: var(--muted); padding: 5px 9px; border-radius: 4px;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tool-btn.active { background: rgba(0,229,255,.1); border-color: var(--accent); color: var(--accent); }
    .tool-btn.danger { color: var(--red); border-color: var(--red); }
    .tool-btn.danger:hover { background: rgba(255,23,68,.1); }

    /* CONTROLS */
    .controls-panel { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 8px; }

    .btn {
      font-family: var(--font-ui); font-weight: 700; font-size: 13px;
      letter-spacing: 1px; border: 1px solid var(--border);
      background: #111822; color: var(--text);
      padding: 8px 14px; border-radius: 4px;
      cursor: pointer; transition: all .15s; text-transform: uppercase;
    }
    .btn:hover  { background: #1a2233; border-color: var(--accent); color: var(--accent); }
    .btn:active { transform: scale(.97); }
    .btn.buy       { background: rgba(0,230,118,.1);  border-color: var(--green); color: var(--green); }
    .btn.sell      { background: rgba(255,23,68,.1);   border-color: var(--red);   color: var(--red);   }
    .btn.close-btn { background: rgba(255,171,0,.1);  border-color: var(--amber); color: var(--amber); }
    .btn.buy:hover       { background: rgba(0,230,118,.2); }
    .btn.sell:hover      { background: rgba(255,23,68,.2);  }
    .btn.close-btn:hover { background: rgba(255,171,0,.2); }
    .btn.tf        { padding: 6px 10px; font-size: 11px; }
    .btn.tf.active { background: rgba(0,229,255,.1); border-color: var(--accent); color: var(--accent); }
    .btn.nav       { font-size: 16px; padding: 8px 16px; }

    .lot-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .lot-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .lot-input {
      background: #111822; border: 1px solid var(--border);
      color: var(--accent); font-family: var(--font-mono); font-size: 13px;
      padding: 6px 10px; border-radius: 4px; width: 80px; text-align: center;
    }
    .lot-input:focus { outline: none; border-color: var(--accent); }

    /* STATS */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--border);
      border-top: 1px solid var(--border);
    }
    .stat-cell { background: var(--panel); padding: 10px 14px; }
    .stat-label { font-family: var(--font-mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-mono); font-size: 16px; color: var(--text); }
    .stat-value.green  { color: var(--green); }
    .stat-value.red    { color: var(--red); }
    .stat-value.cyan   { color: var(--accent); }
    .stat-value.purple { color: var(--purple); }

    /* TRADE LOG */
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; border-top: 1px solid var(--border); background: var(--panel);
    }
    .log-title { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
    #clear-btn { font-family: var(--font-mono); font-size: 9px; background: none; border: 1px solid var(--muted); color: var(--muted); padding: 2px 8px; border-radius: 3px; cursor: pointer; }
    #clear-btn:hover { border-color: var(--red); color: var(--red); }
    #trade-log { max-height: 180px; overflow-y: auto; background: var(--bg); }
    #trade-log::-webkit-scrollbar { width: 4px; }
    #trade-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .trade-row {
      display: grid; grid-template-columns: 30px 40px 1fr 1fr 1fr;
      gap: 6px; align-items: center; padding: 7px 14px;
      border-bottom: 1px solid #0d1117;
      font-family: var(--font-mono); font-size: 11px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateX(-6px); } to { opacity:1; transform: none; } }
    .trade-row:hover { background: #0d1117; }
    .trade-num { color: var(--muted); }
    .trade-type.B { color: var(--green); }
    .trade-type.S { color: var(--red); }
    .trade-pnl.pos { color: var(--green); }
    .trade-pnl.neg { color: var(--red); }
    .empty-log { text-align: center; padding: 24px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a2233; border: 1px solid var(--border);
      color: var(--text); font-family: var(--font-mono); font-size: 12px;
      padding: 10px 18px; border-radius: 6px;
      z-index: 999; transition: transform .3s ease, opacity .3s ease;
      opacity: 0; white-space: nowrap; max-width: 90vw;
    }
    #toast.show  { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.green { border-color: var(--green); color: var(--green); }
    #toast.red   { border-color: var(--red);   color: var(--red);   }
    #toast.amber { border-color: var(--amber); color: var(--amber); }
    #toast.purple{ border-color: var(--purple);color: var(--purple);}

    /* FIB LEGEND */
    #fib-legend {
      position: absolute; top: 6px; right: 6px;
      background: rgba(9,11,15,.85); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 10px;
      font-family: var(--font-mono); font-size: 10px;
      z-index: 20; display: none;
    }
    .fib-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .fib-swatch { width: 18px; height: 2px; }
  </style>
</head>
<body>

<header>
  <div class="logo">BACKTEST<span>PRO</span></div>
  <div id="status-badge">LOADING...</div>
</header>

<div class="ticker-row">
  <div id="price-display">-.-----</div>
  <div id="price-change">+0.0%</div>
  <div id="position-badge"></div>
</div>

<!-- DRAWING TOOLBAR -->
<div class="toolbar">
  <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-right:4px;">TOOLS</span>
  <button class="tool-btn" id="tool-cursor"     onclick="setTool('cursor')"    title="Select / Pan">✦ Cursor</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="tool-trendline"  onclick="setTool('trendline')" title="Trendline">╱ Trendline</button>
  <button class="tool-btn" id="tool-hline"      onclick="setTool('hline')"     title="Horizontal Line">— H.Line</button>
  <button class="tool-btn" id="tool-vline"      onclick="setTool('vline')"     title="Vertical Line">| V.Line</button>
  <button class="tool-btn" id="tool-box"        onclick="setTool('box')"       title="Rectangle Box">▭ Box</button>
  <button class="tool-btn" id="tool-fib"        onclick="setTool('fib')"       title="Fibonacci Retracement">〜 Fib</button>
  <div class="tool-sep"></div>
  <button class="tool-btn danger" onclick="clearDrawings()">✕ Clear</button>
</div>

<!-- CHART -->
<div id="chart-wrap">
  <div id="chart"></div>
  <canvas id="draw-canvas"></canvas>
  <div id="fib-legend"></div>
</div>

<!-- TRADE CONTROLS -->
<div class="controls-panel">
  <div class="row">
    <button class="btn nav" onclick="prevBar()">◀</button>
    <button class="btn nav" onclick="nextBar()">▶</button>
    <button class="btn buy"       onclick="openTrade('BUY')">BUY</button>
    <button class="btn sell"      onclick="openTrade('SELL')">SELL</button>
    <button class="btn close-btn" onclick="closeTrade()">CLOSE</button>
    <div class="lot-wrap">
      <span class="lot-label">Lot</span>
      <input class="lot-input" id="lot-size" type="number" value="0.1" min="0.01" max="100" step="0.01">
    </div>
  </div>
  <div class="row">
    <button class="btn tf active" onclick="setTimeframe(1,    this)">1m</button>
    <button class="btn tf"        onclick="setTimeframe(5,    this)">5m</button>
    <button class="btn tf"        onclick="setTimeframe(15,   this)">15m</button>
    <button class="btn tf"        onclick="setTimeframe(60,   this)">1H</button>
    <button class="btn tf"        onclick="setTimeframe(240,  this)">4H</button>
    <button class="btn tf"        onclick="setTimeframe(1440, this)">D</button>
    <button class="btn tf"        onclick="setTimeframe(10080,this)">W</button>
    <button class="btn tf"        onclick="setTimeframe(43200,this)">M</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-grid">
  <div class="stat-cell"><div class="stat-label">Open P&L (pips)</div><div class="stat-value cyan" id="open-pnl">—</div></div>
  <div class="stat-cell"><div class="stat-label">Open P&L ($)</div><div class="stat-value cyan" id="open-pnl-usd">—</div></div>
  <div class="stat-cell"><div class="stat-label">Total P&L ($)</div><div class="stat-value" id="total-pnl">$0.00</div></div>
  <div class="stat-cell"><div class="stat-label">Win Rate</div><div class="stat-value" id="win-rate">—</div></div>
  <div class="stat-cell"><div class="stat-label">Trades</div><div class="stat-value" id="trade-count">0</div></div>
  <div class="stat-cell"><div class="stat-label">Bar</div><div class="stat-value cyan" id="bar-counter">—</div></div>
</div>

<!-- TRADE LOG -->
<div class="log-header">
  <div class="log-title">Trade History</div>
  <button id="clear-btn" onclick="clearTrades()">CLEAR</button>
</div>
<div id="trade-log">
  <div class="empty-log">No trades yet. Use BUY / SELL to begin.</div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
let rawBars = [], bars = [], currentIndex = 1, currentTf = 1;
let currentPosition = null, trades = [];
const PIP_VALUE_PER_LOT = 10, PIP_SIZE = 0.0001;

// Drawing state
let activeTool   = 'cursor';
let drawings     = [];        // committed shapes
let isDrawing    = false;
let drawStart    = null;      // { x, y, price, time }
let drawPreview  = null;      // live second point

// ══════════════════════════════════════════════════════════
//  CHART
// ══════════════════════════════════════════════════════════
const chartEl = document.getElementById('chart');
const getW = () => { const w = chartEl.getBoundingClientRect().width; return w > 0 ? w : window.innerWidth; };

const chart = LightweightCharts.createChart(chartEl, {
  width: getW(), height: 380,
  layout: { background: { color: '#090b0f' }, textColor: '#6b7a99' },
  grid:   { vertLines: { color: '#0d1117' }, horzLines: { color: '#0d1117' } },
  timeScale: {
    timeVisible: true, secondsVisible: true,
    borderColor: '#1a2233',
    tickMarkFormatter: (t) => {
      const d = new Date(t * 1000);
      const pad = n => String(n).padStart(2,'0');
      if (currentTf >= 43200) return `${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}`;
      if (currentTf >= 10080) return `${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())}`;
      if (currentTf >= 1440)  return `${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())}`;
      return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    }
  },
  rightPriceScale: { borderColor: '#1a2233' },
  crosshair: {
    mode: 1,
    vertLine: { color: '#00e5ff33', labelBackgroundColor: '#0d1117' },
    horzLine: { color: '#00e5ff33', labelBackgroundColor: '#0d1117' }
  }
});

const candleSeries = chart.addCandlestickSeries({
  upColor: '#00e676', downColor: '#ff1744',
  borderVisible: false,
  wickUpColor: '#00e676', wickDownColor: '#ff1744'
});

window.addEventListener('resize', () => { chart.resize(getW(), 380); resizeCanvas(); renderDrawings(); });

// ══════════════════════════════════════════════════════════
//  CANVAS OVERLAY
// ══════════════════════════════════════════════════════════
const canvas = document.getElementById('draw-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const rect = chartEl.getBoundingClientRect();
  canvas.width  = rect.width;
  canvas.height = rect.height;
}

// Convert pixel Y → price
function yToPrice(y) {
  // Use LightweightCharts coordinate conversion
  return candleSeries.coordinateToPrice(y);
}
// Convert price → pixel Y
function priceToY(price) {
  return candleSeries.priceToCoordinate(price);
}
// Convert pixel X → timestamp (approximate via timeScale)
function xToTime(x) {
  return chart.timeScale().coordinateToTime(x);
}
// Convert timestamp → pixel X
function timeToX(t) {
  return chart.timeScale().timeToCoordinate(t);
}

// ══════════════════════════════════════════════════════════
//  TOOL SELECTION
// ══════════════════════════════════════════════════════════
function setTool(tool) {
  activeTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tool-' + tool);
  if (el) el.classList.add('active');
  canvas.classList.toggle('active', tool !== 'cursor');
  if (tool === 'cursor') { isDrawing = false; drawStart = null; renderDrawings(); }
  toast(tool === 'cursor' ? 'Pan / Zoom mode' : tool.toUpperCase() + ' tool active — click to place', 'purple');
}

// Init cursor active
document.getElementById('tool-cursor').classList.add('active');

// ══════════════════════════════════════════════════════════
//  POINTER EVENTS ON CANVAS
// ══════════════════════════════════════════════════════════
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

canvas.addEventListener('mousedown',  onPointerDown);
canvas.addEventListener('mousemove',  onPointerMove);
canvas.addEventListener('mouseup',    onPointerUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onPointerDown(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onPointerMove(e); }, { passive: false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); onPointerUp(e);   }, { passive: false });

function onPointerDown(e) {
  if (activeTool === 'cursor') return;
  const pos   = getCanvasPos(e);
  const price = yToPrice(pos.y);
  const time  = xToTime(pos.x);
  if (price == null || time == null) return;

  if (!isDrawing) {
    // First click — set anchor
    isDrawing  = true;
    drawStart  = { x: pos.x, y: pos.y, price, time };
    drawPreview = null;

    // For hline / vline single-click commit
    if (activeTool === 'hline') {
      drawings.push({ type: 'hline', price });
      isDrawing = false; drawStart = null;
      renderDrawings();
      return;
    }
    if (activeTool === 'vline') {
      drawings.push({ type: 'vline', time, x: pos.x });
      isDrawing = false; drawStart = null;
      renderDrawings();
      return;
    }
  } else {
    // Second click — commit shape
    const price2 = yToPrice(pos.y);
    const time2  = xToTime(pos.x);

    if (activeTool === 'trendline') {
      drawings.push({ type: 'trendline', p1: { price: drawStart.price, time: drawStart.time }, p2: { price: price2, time: time2 } });
    } else if (activeTool === 'box') {
      drawings.push({ type: 'box',
        p1: { price: drawStart.price, time: drawStart.time },
        p2: { price: price2, time: time2 }
      });
    } else if (activeTool === 'fib') {
      drawings.push({ type: 'fib',
        p1: { price: drawStart.price, time: drawStart.time },
        p2: { price: price2, time: time2 }
      });
      showFibLegend(drawStart.price, price2);
    }

    isDrawing = false; drawStart = null; drawPreview = null;
    renderDrawings();
  }
}

function onPointerMove(e) {
  if (!isDrawing || activeTool === 'cursor') return;
  const pos = getCanvasPos(e);
  drawPreview = { x: pos.x, y: pos.y, price: yToPrice(pos.y), time: xToTime(pos.x) };
  renderDrawings();
}

function onPointerUp(e) { /* handled by click model */ }

// ══════════════════════════════════════════════════════════
//  RENDER DRAWINGS
// ══════════════════════════════════════════════════════════
const FIB_LEVELS = [
  { r: 0,     color: '#00e5ff', label: '0.000' },
  { r: 0.236, color: '#bb86fc', label: '0.236' },
  { r: 0.382, color: '#ffab00', label: '0.382' },
  { r: 0.5,   color: '#ffffff', label: '0.500' },
  { r: 0.618, color: '#00e676', label: '0.618' },
  { r: 0.786, color: '#ff6d00', label: '0.786' },
  { r: 1,     color: '#ff1744', label: '1.000' },
];

function renderDrawings() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const d of drawings) drawShape(d, false);

  // Preview while dragging
  if (isDrawing && drawStart && drawPreview) {
    const preview = buildPreview();
    if (preview) drawShape(preview, true);
  }
}

function buildPreview() {
  if (!drawPreview) return null;
  if (activeTool === 'trendline') return { type:'trendline', p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawPreview.price,time:drawPreview.time} };
  if (activeTool === 'box')       return { type:'box',       p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawPreview.price,time:drawPreview.time} };
  if (activeTool === 'fib')       return { type:'fib',       p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawPreview.price,time:drawPreview.time} };
  return null;
}

function drawShape(d, isPreview) {
  ctx.save();
  ctx.globalAlpha = isPreview ? 0.6 : 1;

  if (d.type === 'hline') {
    const y = priceToY(d.price);
    if (y == null) { ctx.restore(); return; }
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth   = 1;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#00e5ff'; ctx.font = '10px Share Tech Mono';
    ctx.fillText(d.price.toFixed(5), 4, y - 4);
  }

  else if (d.type === 'vline') {
    // re-compute x from stored time each render (timeScale may shift)
    const x = timeToX(d.time);
    if (x == null) { ctx.restore(); return; }
    ctx.strokeStyle = '#ffab00';
    ctx.lineWidth   = 1;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    ctx.setLineDash([]);
  }

  else if (d.type === 'trendline') {
    const x1 = timeToX(d.p1.time), y1 = priceToY(d.p1.price);
    const x2 = timeToX(d.p2.time), y2 = priceToY(d.p2.price);
    if (x1==null||x2==null||y1==null||y2==null) { ctx.restore(); return; }
    ctx.strokeStyle = '#00e676'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // Dots at endpoints
    ctx.fillStyle = '#00e676';
    ctx.beginPath(); ctx.arc(x1,y1,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x2,y2,3,0,Math.PI*2); ctx.fill();
  }

  else if (d.type === 'box') {
    const x1 = timeToX(d.p1.time), y1 = priceToY(d.p1.price);
    const x2 = timeToX(d.p2.time), y2 = priceToY(d.p2.price);
    if (x1==null||x2==null||y1==null||y2==null) { ctx.restore(); return; }
    const rx = Math.min(x1,x2), ry = Math.min(y1,y2);
    const rw = Math.abs(x2-x1),  rh = Math.abs(y2-y1);
    ctx.strokeStyle = '#ffab00'; ctx.lineWidth = 1.5;
    ctx.fillStyle   = 'rgba(255,171,0,0.06)';
    ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeRect(rx,ry,rw,rh);
  }

  else if (d.type === 'fib') {
    const x1 = timeToX(d.p1.time), x2 = timeToX(d.p2.time);
    if (x1==null||x2==null) { ctx.restore(); return; }
    const high  = Math.max(d.p1.price, d.p2.price);
    const low   = Math.min(d.p1.price, d.p2.price);
    const range = high - low;
    const xL = Math.min(x1,x2), xR = Math.max(x1,x2);

    for (const lvl of FIB_LEVELS) {
      const price = high - range * lvl.r;
      const y = priceToY(price);
      if (y == null) continue;
      ctx.strokeStyle = lvl.color; ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(xL,y); ctx.lineTo(xR,y); ctx.stroke();
      ctx.setLineDash([]);
      // Fill band between adjacent levels
      if (lvl.r > 0) {
        const prevR   = FIB_LEVELS[FIB_LEVELS.indexOf(lvl)-1].r;
        const prevPrice = high - range * prevR;
        const yPrev = priceToY(prevPrice);
        if (yPrev != null) {
          ctx.fillStyle = lvl.color + '14';
          ctx.fillRect(xL, Math.min(y,yPrev), xR-xL, Math.abs(y-yPrev));
        }
      }
      // Label
      ctx.fillStyle = lvl.color; ctx.font = '9px Share Tech Mono';
      ctx.fillText(`${lvl.label}  ${price.toFixed(5)}`, xL + 4, y - 3);
    }
  }

  ctx.restore();
}

function clearDrawings() {
  drawings = []; isDrawing = false; drawStart = null; drawPreview = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('fib-legend').style.display = 'none';
  toast('Drawings cleared', 'amber');
}

function showFibLegend(p1, p2) {
  const high  = Math.max(p1,p2), low = Math.min(p1,p2), range = high-low;
  const leg   = document.getElementById('fib-legend');
  leg.style.display = 'block';
  leg.innerHTML = '<div style="color:var(--muted);font-size:9px;margin-bottom:5px;letter-spacing:1px;">FIB LEVELS</div>' +
    FIB_LEVELS.map(lvl => {
      const price = (high - range * lvl.r).toFixed(5);
      return `<div class="fib-row">
        <div class="fib-swatch" style="background:${lvl.color}"></div>
        <span style="color:${lvl.color}">${lvl.label}</span>
        <span style="color:var(--text)">${price}</span>
      </div>`;
    }).join('');
}

// ══════════════════════════════════════════════════════════
//  MOCK DATA
// ══════════════════════════════════════════════════════════
function generateMock() {
  const data = []; let t = 1700000000, price = 1.0890;
  for (let i = 0; i < 500; i++) {
    const move = (Math.random() - 0.49) * 0.0008;
    const open = price, close = +(open + move).toFixed(5);
    const high = +(Math.max(open,close) + Math.random()*0.0003).toFixed(5);
    const low  = +(Math.min(open,close) - Math.random()*0.0003).toFixed(5);
    data.push({ time:t, open, high, low, close });
    price = close; t += 60;
  }
  return data;
}

// ══════════════════════════════════════════════════════════
//  INIT / CSV LOAD
// ══════════════════════════════════════════════════════════
async function init() {
  resizeCanvas();
  setStatus('LOADING','');
  try { await loadCSV(); }
  catch(e) {
    console.warn('CSV failed, using mock.', e);
    setStatus('MOCK','warn');
    rawBars = generateMock();
    finishLoad('Mock dataset (500 bars)');
  }
}

async function loadCSV() {
  const res = await fetch('data.csv');
  if (!res.ok) throw new Error('fetch failed');
  const text = await res.text();
  const lines = text.split('\n');
  let start = 0;
  for (let i=0;i<lines.length;i++) {
    const l = lines[i].toLowerCase().trim();
    if (l.startsWith('date')||l.includes('open')) { start=i+1; break; }
  }
  const seen = new Set();
  rawBars = lines.slice(start).filter(l=>l.trim()).map(line => {
    const p = line.split(',');
    if (p.length < 5) return null;
    const ts = Math.floor(Date.parse(p[0].trim().replace(' ','T')) / 1000);
    if (isNaN(ts)) return null;
    return { time:ts, open:parseFloat(p[1]), high:parseFloat(p[2]), low:parseFloat(p[3]), close:parseFloat(p[4]) };
  }).filter(b=>b!==null).sort((a,b)=>a.time-b.time).filter(b=>{ if(seen.has(b.time))return false; seen.add(b.time); return true; });
  if (!rawBars.length) throw new Error('empty');
  finishLoad(`${rawBars.length} bars from data.csv`);
}

function finishLoad(msg) {
  bars = [...rawBars];
  currentIndex = Math.min(50, bars.length);
  setStatus('✓ '+msg, 'ok');
  updateChart();
}

// ══════════════════════════════════════════════════════════
//  CHART UPDATE
// ══════════════════════════════════════════════════════════
function updateChart() {
  if (!bars.length) return;
  currentIndex = Math.max(1, Math.min(currentIndex, bars.length));
  candleSeries.setData(bars.slice(0, currentIndex));
  redrawMarkers();
  setTimeout(() => { chart.timeScale().fitContent(); renderDrawings(); }, 50);

  const bar = bars[currentIndex-1], price = bar.close;
  document.getElementById('price-display').textContent = price.toFixed(5);
  document.getElementById('bar-counter').textContent   = `${currentIndex} / ${bars.length}`;

  if (currentIndex > 1) {
    const prev = bars[currentIndex-2].close;
    const chg  = ((price-prev)/prev*100).toFixed(3);
    const el   = document.getElementById('price-change');
    el.textContent  = (chg>=0?'+':'')+chg+'%';
    el.style.background = chg>=0 ? 'rgba(0,230,118,.12)' : 'rgba(255,23,68,.12)';
    el.style.color      = chg>=0 ? 'var(--green)' : 'var(--red)';
  }
  updateOpenPnl(price);
}

// ══════════════════════════════════════════════════════════
//  MARKERS
// ══════════════════════════════════════════════════════════
function redrawMarkers() {
  const markers = [];
  trades.forEach(t => {
    if (t.entryIndex <= currentIndex)
      markers.push({ time: bars[t.entryIndex-1].time, position: t.type==='BUY'?'belowBar':'aboveBar',
        color: t.type==='BUY'?'#00e676':'#ff1744', shape: t.type==='BUY'?'arrowUp':'arrowDown', text: t.type==='BUY'?'▲B':'▼S' });
    if (t.exitIndex && t.exitIndex <= currentIndex)
      markers.push({ time: bars[t.exitIndex-1].time, position: t.type==='BUY'?'aboveBar':'belowBar',
        color: '#ffab00', shape: 'circle', text: 'X' });
  });
  if (currentPosition)
    markers.push({ time: bars[currentPosition.entryIndex-1].time,
      position: currentPosition.type==='BUY'?'belowBar':'aboveBar',
      color: currentPosition.type==='BUY'?'#00e676':'#ff1744',
      shape: currentPosition.type==='BUY'?'arrowUp':'arrowDown',
      text:  currentPosition.type==='BUY'?'▲B':'▼S' });
  markers.sort((a,b)=>a.time-b.time);
  candleSeries.setMarkers(markers);
}

// ══════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════
function nextBar() { if (currentIndex<bars.length){currentIndex++;updateChart();}else toast('End of data','amber'); }
function prevBar() { if (currentIndex>1){currentIndex--;updateChart();} }

// ══════════════════════════════════════════════════════════
//  TIMEFRAME AGGREGATION
// ══════════════════════════════════════════════════════════
function setTimeframe(minutes, btn) {
  if (!rawBars.length) return;
  currentTf = minutes;
  document.querySelectorAll('.btn.tf').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  if (minutes === 1) {
    const seen = new Set();
    bars = rawBars.filter(b=>{ if(seen.has(b.time))return false; seen.add(b.time); return true; });
    currentIndex = Math.min(currentIndex, bars.length);
    updateChart(); return;
  }

  const intv = minutes * 60;
  bars = [];
  let chunk = [], chunkStart = Math.floor(rawBars[0].time / intv) * intv;

  for (const bar of rawBars) {
    if (bar.time < chunkStart + intv) {
      chunk.push(bar);
    } else {
      if (chunk.length) pushAgg(chunk, chunkStart);
      chunk = [bar];
      chunkStart = Math.floor(bar.time / intv) * intv;
    }
  }
  if (chunk.length) pushAgg(chunk, chunkStart);

  currentIndex = Math.min(currentIndex, bars.length);
  updateChart();
}

function pushAgg(chunk, t) {
  bars.push({ time:t, open:chunk[0].open, high:Math.max(...chunk.map(b=>b.high)), low:Math.min(...chunk.map(b=>b.low)), close:chunk[chunk.length-1].close });
}

// ══════════════════════════════════════════════════════════
//  TRADE ENGINE
// ══════════════════════════════════════════════════════════
function getLot() { const v=parseFloat(document.getElementById('lot-size').value); return isNaN(v)||v<=0?0.1:v; }

function openTrade(type) {
  if (currentPosition){ toast('Close current trade first!','amber'); return; }
  const price=bars[currentIndex-1].close, lotSize=getLot();
  currentPosition={type,entryPrice:price,entryIndex:currentIndex,lotSize};
  const badge=document.getElementById('position-badge');
  badge.style.display='block'; badge.className=type==='BUY'?'long':'short';
  badge.textContent=`${type} ${lotSize}L @ ${price.toFixed(5)}`;
  redrawMarkers();
  toast(`${type} ${lotSize} lot @ ${price.toFixed(5)}`, type==='BUY'?'green':'red');
}

function closeTrade() {
  if (!currentPosition){ toast('No open trade to close.','amber'); return; }
  const exitPrice=bars[currentIndex-1].close;
  const rawDiff=currentPosition.type==='BUY'?exitPrice-currentPosition.entryPrice:currentPosition.entryPrice-exitPrice;
  const pips=rawDiff/PIP_SIZE, usdPnl=pips*PIP_VALUE_PER_LOT*currentPosition.lotSize;
  const trade={ id:trades.length+1, type:currentPosition.type, entryPrice:currentPosition.entryPrice,
    exitPrice, entryIndex:currentPosition.entryIndex, exitIndex:currentIndex,
    lotSize:currentPosition.lotSize, pips:+pips.toFixed(1), usdPnl:+usdPnl.toFixed(2), win:usdPnl>0 };
  trades.push(trade); currentPosition=null;
  document.getElementById('position-badge').style.display='none';
  document.getElementById('open-pnl').textContent='—';
  document.getElementById('open-pnl-usd').textContent='—';
  updateStats(); redrawMarkers(); addTradeRow(trade);
  toast(`Closed: ${trade.pips>0?'+':''}${trade.pips} pips | ${trade.usdPnl>=0?'+$':'-$'}${Math.abs(trade.usdPnl).toFixed(2)}`, trade.win?'green':'red');
}

function updateOpenPnl(price) {
  if (!currentPosition) return;
  const rawDiff=currentPosition.type==='BUY'?price-currentPosition.entryPrice:currentPosition.entryPrice-price;
  const pips=rawDiff/PIP_SIZE, usdPnl=pips*PIP_VALUE_PER_LOT*currentPosition.lotSize;
  const pEl=document.getElementById('open-pnl'), uEl=document.getElementById('open-pnl-usd');
  pEl.textContent=(pips>=0?'+':'')+pips.toFixed(1);
  uEl.textContent=(usdPnl>=0?'+$':'-$')+Math.abs(usdPnl).toFixed(2);
  pEl.className=uEl.className='stat-value '+(pips>=0?'green':'red');
}

function updateStats() {
  if (!trades.length) return;
  const totalUsd=trades.reduce((s,t)=>s+t.usdPnl,0);
  const wins=trades.filter(t=>t.win).length, wr=(wins/trades.length*100).toFixed(1);
  const pEl=document.getElementById('total-pnl');
  pEl.textContent=(totalUsd>=0?'+$':'-$')+Math.abs(totalUsd).toFixed(2);
  pEl.className='stat-value '+(totalUsd>=0?'green':'red');
  const wEl=document.getElementById('win-rate');
  wEl.textContent=wr+'%';
  wEl.className='stat-value '+(parseFloat(wr)>=50?'green':'red');
  document.getElementById('trade-count').textContent=trades.length;
}

// ══════════════════════════════════════════════════════════
//  TRADE LOG
// ══════════════════════════════════════════════════════════
function addTradeRow(t) {
  const log=document.getElementById('trade-log');
  const empty=log.querySelector('.empty-log'); if(empty) empty.remove();
  const div=document.createElement('div'); div.className='trade-row';
  div.innerHTML=`<span class="trade-num">#${t.id}</span><span class="trade-type ${t.type[0]}">${t.type}</span><span>${t.entryPrice.toFixed(5)}</span><span>${t.exitPrice.toFixed(5)}</span><span class="trade-pnl ${t.win?'pos':'neg'}">${t.usdPnl>=0?'+':''}$${t.usdPnl.toFixed(2)}</span>`;
  log.prepend(div);
}

function clearTrades() {
  if (!trades.length) return;
  trades=[]; currentPosition=null;
  document.getElementById('position-badge').style.display='none';
  document.getElementById('trade-log').innerHTML='<div class="empty-log">No trades yet. Use BUY / SELL to begin.</div>';
  ['total-pnl','win-rate','open-pnl','open-pnl-usd'].forEach(id=>{ document.getElementById(id).textContent='—'; document.getElementById(id).className='stat-value'; });
  document.getElementById('total-pnl').textContent='$0.00';
  document.getElementById('trade-count').textContent='0';
  redrawMarkers(); toast('Trade history cleared','amber');
}

// ══════════════════════════════════════════════════════════
//  TOAST / STATUS
// ══════════════════════════════════════════════════════════
let toastTimer;
function toast(msg,type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show '+type;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.className=''; },2800);
}
function setStatus(msg,cls) { const el=document.getElementById('status-badge'); el.textContent=msg; el.className=cls; }

// ══════════════════════════════════════════════════════════
//  KEYBOARD
// ══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight') nextBar();
  if (e.key==='ArrowLeft')  prevBar();
  if (e.key==='b'||e.key==='B') openTrade('BUY');
  if (e.key==='s'||e.key==='S') openTrade('SELL');
  if (e.key==='c'||e.key==='C') closeTrade();
  if (e.key==='Escape') setTool('cursor');
  if (e.key==='t'||e.key==='T') setTool('trendline');
  if (e.key==='h'||e.key==='H') setTool('hline');
  if (e.key==='v'||e.key==='V') setTool('vline');
  if (e.key==='x'||e.key==='X') setTool('box');
  if (e.key==='f'||e.key==='F') setTool('fib');
});

// Re-render drawings when chart pans/zooms
chart.timeScale().subscribeVisibleTimeRangeChange(() => renderDrawings());
chart.subscribeCrosshairMove(() => { if (!isDrawing) renderDrawings(); });

window.addEventListener('DOMContentLoaded', init);
</script>
